<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4c9"/>
      <stop offset="25%" stop-color="#e2b94a"/>
      <stop offset="50%" stop-color="#ca9a28"/>
      <stop offset="75%" stop-color="#f5d67b"/>
      <stop offset="100%" stop-color="#946d14"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#goldGlow)" fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Royal Crown -->
    <path d="M 130 35 L 136 50 L 150 25 L 164 50 L 170 35 L 172 58 L 128 58 Z" stroke-width="1.5" fill="url(#goldGradient)"/>
    <circle cx="130" cy="33" r="2.5"/>
    <circle cx="150" cy="23" r="3.5"/>
    <circle cx="170" cy="33" r="2.5"/>
    <rect x="126" y="58" width="48" height="6" rx="2" stroke-width="1"/>
    <circle cx="134" cy="61" r="1.5" fill="#111"/>
    <circle cx="150" cy="61" r="1.5" fill="#111"/>
    <circle cx="166" cy="61" r="1.5" fill="#111"/>

    <!-- Left Heraldic Lion Rampant -->
    <path d="M 118 70 Q 112 64 105 66 Q 98 70 100 80 Q 94 80 90 86 Q 86 92 88 100 Q 82 102 78 112 Q 74 122 80 134 Q 85 145 92 148 Q 96 150 94 158 Q 90 168 82 174 L 86 178 Q 98 174 102 162 Q 106 150 104 142 Q 112 145 116 138 Q 120 130 115 120 Q 122 110 120 95 Q 124 85 118 70 Z" stroke-width="1.5"/>
    <path d="M 104 88 Q 115 82 126 84 L 124 90 Q 115 88 106 94 Z" stroke-width="1"/>
    <path d="M 102 105 Q 114 102 124 106 L 122 112 Q 112 108 102 112 Z" stroke-width="1"/>

    <!-- Right Heraldic Unicorn / Lion Rampant -->
    <path d="M 182 70 Q 188 64 195 66 Q 202 70 200 80 Q 206 80 210 86 Q 214 92 212 100 Q 218 102 222 112 Q 226 122 220 134 Q 215 145 208 148 Q 204 150 206 158 Q 210 168 218 174 L 214 178 Q 202 174 198 162 Q 194 150 196 142 Q 188 145 184 138 Q 180 130 185 120 Q 178 110 180 95 Q 176 85 182 70 Z" stroke-width="1.5"/>
    <path d="M 196 88 Q 185 82 174 84 L 176 90 Q 185 88 194 94 Z" stroke-width="1"/>
    <path d="M 198 105 Q 186 102 176 106 L 178 112 Q 188 108 198 112 Z" stroke-width="1"/>

    <!-- Central Ornate Shield -->
    <path d="M 130 72 L 170 72 Q 174 105 168 128 Q 160 148 150 158 Q 140 148 132 128 Q 126 105 130 72 Z" fill="#0d1117" stroke="url(#goldGradient)" stroke-width="2.5"/>
    <path d="M 134 76 L 166 76 Q 170 103 164 124 Q 158 142 150 151 Q 142 142 136 124 Q 130 103 134 76 Z" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- Shield Emblem / Monogram -->
    <path d="M 144 110 Q 144 95 150 90 Q 156 95 156 110 Q 162 118 160 130 L 140 130 Q 138 118 144 110 Z" fill="url(#goldGradient)"/>
    <circle cx="150" cy="86" r="3" fill="url(#goldGradient)"/>

    <!-- Acanthus Leaves & Filigree Flourishes -->
    <path d="M 125 155 Q 110 165 95 160 Q 110 175 135 166 Z" stroke-width="1"/>
    <path d="M 175 155 Q 190 165 205 160 Q 190 175 165 166 Z" stroke-width="1"/>

    <!-- Bottom Banner Ribbon -->
    <path d="M 75 180 L 105 174 L 115 184 L 150 178 L 185 184 L 195 174 L 225 180 L 215 194 L 190 188 L 150 196 L 110 188 L 85 194 Z" fill="#0c0e12" stroke="url(#goldGradient)" stroke-width="1.8"/>
  </g>

  <!-- Banner Typography -->
  <text x="150" y="190" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="8.5" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="2.5">QUALITY SPIRITS</text>
  <text x="150" y="70" font-family="'Cinzel', Georgia, serif" font-size="7" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="2">KARAN'S</text>
</svg>
